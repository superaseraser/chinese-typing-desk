name: Deploy typing tool

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned MSIME package
        run: |
          mkdir -p .engine
          npm pack @msime/web-engine@0.2.0 --ignore-scripts --pack-destination .engine
          tar -xzf .engine/msime-web-engine-0.2.0.tgz -C .engine
          npm view @msime/web-engine@0.2.0 --json > .engine/package-metadata.json
      - name: Install build and browser tools
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.56.1 esbuild@0.25.12
          npx playwright install --with-deps chromium
      - name: Build offline edition
        run: node scripts/build-offline.mjs
      - name: Verify genuinely offline typing
        run: node scripts/verify-offline.mjs
      - name: Package downloadable offline tool
        run: |
          mkdir -p public/downloads
          cd offline-package
          zip -q -r ../public/downloads/chinese-typing-desk-offline.zip .
      - name: Upload offline test proof
        uses: actions/upload-artifact@v4
        with:
          name: offline-verification
          path: offline-verified.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static page
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
